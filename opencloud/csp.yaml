---
# Content-Security-Policy for OpenCloud when authenticating against the external
# Keycloak (http://localhost:8080). Based on the OpenCloud default CSP, with the
# Keycloak origin added to connect-src/script-src/frame-src so the web client can
# complete the OIDC login flow. Referenced via PROXY_CSP_CONFIG_FILE_LOCATION.
directives:
  child-src:
    - '''self'''
  connect-src:
    - '''self'''
    - 'blob:'
    - http://localhost:8080/
    - https://raw.githubusercontent.com/opencloud-eu/awesome-apps/
    - https://update.opencloud.eu/
    - https://tile.openstreetmap.org/
  default-src:
    - '''none'''
  font-src:
    - '''self'''
  frame-ancestors:
    - '''self'''
  frame-src:
    - '''self'''
    - 'blob:'
    - http://localhost:8080/
    - https://embed.diagrams.net/
    - https://docs.opencloud.eu
  img-src:
    - '''self'''
    - 'data:'
    - 'blob:'
    - https://raw.githubusercontent.com/opencloud-eu/awesome-apps/
    - https://tile.openstreetmap.org/
  manifest-src:
    - '''self'''
  media-src:
    - '''self'''
  object-src:
    - '''self'''
    - 'blob:'
  script-src:
    - '''self'''
    - '''unsafe-inline'''
    - http://localhost:8080/
  style-src:
    - '''self'''
    - '''unsafe-inline'''
  worker-src:
    - '''self'''
    - 'blob:'
