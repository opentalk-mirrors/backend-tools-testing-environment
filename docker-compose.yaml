version: "3.9"
services:
    keycloak:
        image: quay.io/keycloak/keycloak:13.0.1
        environment:
            DB_VENDOR: h2
            KEYCLOAK_USER: admin
            KEYCLOAK_PASSWORD: admin
            KEYCLOAK_IMPORT: /tmp/keycloak/keycloak_realm_export.json
        volumes:
            - ./keycloak:/tmp/keycloak:Z
        ports: 
            - "8080:8080"
            - "8443:8443"
    postgres:
        image: postgres:13-alpine
        environment:
            POSTGRES_DB: k3k
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: "password123"
            POSTGRES_HOST_AUTH_METHOD: trust
        ports:
            - "5432:5432"
    turn:
        image: coturn/coturn:latest
        network_mode: "host"
        command: 
            - --use-auth-secret
            - --static-auth-secret=k3k
            - --realm=heinlein-video.de
    janus:
        image: quay.io/freswa/janus-gateway:0.11.1
        command:
            - janus
            - -d 5
        network_mode: "host"
        depends_on:
            - rabbit
        volumes:
            - ./janus/janus.transport.rabbitmq.jcfg:/etc/janus/janus.transport.rabbitmq.jcfg:Z
    rabbit:
        image: rabbitmq:3-management
        ports:
            - "8280:15672"
            - "5672:5672"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8280"]
            interval: 30s
            timeout: 10s
            retries: 5
    redis:
        image: redis:6.2
        command:
            - /usr/local/etc/redis/redis.conf
        network_mode: "host"
        volumes:
            - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:Z

