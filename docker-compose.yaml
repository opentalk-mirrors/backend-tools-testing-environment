---
version: "3.3"
networks:
    rabbitmq-prometheus: null
services:
    postgres:
        image: postgres:13-alpine
        environment:
            POSTGRES_DB: ${DATABASE}
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: "password123"
            POSTGRES_HOST_AUTH_METHOD: trust
        ports:
            - "5432:5432"
        volumes:
            - ./pg_data:/var/lib/postgresql/data
        command:
            - "postgres"
            - "-c"
            - "shared_preload_libraries=pg_stat_statements"
    turn:
        image: coturn/coturn:latest
        network_mode: "host"
        command:
            - --use-auth-secret
            - --static-auth-secret=k3k
            - --realm=heinlein-video.de
    janus:
        image: quay.io/freswa/janus-gateway-rmq:latest
        command:
            - janus
            - -d 5
        environment:
            JANUS_EXCHANGE_TYPE: topic
        network_mode: "host"
        depends_on:
            - rabbit
    rabbit:
        image: rabbitmq:3-management
        environment:
            RABBITMQ_SERVER_ADITIONAL_ERL_ARGS: "-rabbit log.console.level=debug"
        ports:
            - "8280:15672"
            - "5672:5672"
        healthcheck:
            test: [ "CMD", "rabbitmqctl", "node_health_check" ]
            interval: 30s
            timeout: 10s
            retries: 5
        networks:
            - "rabbitmq-prometheus"
    redis:
        image: redis:alpine
        command:
            - /usr/local/etc/redis/redis.conf
        volumes:
            - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:Z
        ports:
            - "6379:6379"

    ndt:
        image: measurementlab/ndt-server:latest
        volumes:
            - ./ndt/certs:/certs #- ./ndt/html:/html
            - ./ndt/datadir:/datadir
        cap_drop:
            - ALL
        ports:
            - 10443:4443
            - 10081:8080
        command:
            [
                "-cert",
                "/certs/cert.pem",
                "-key",
                "/certs/key.pem",
                "-datadir",
                "/datadir",
                "-ndt7_addr",
                ":4443",
                "-ndt7_addr_cleartext",
                ":8080"
            ]
