---
volumes:
  rabbitmq-prometheus_prometheus: null
  rabbitmq-prometheus_grafana: null

services:
  postgres:
    image: registry.heinlein.group/opentalk/postgres:v17
    environment:
      POSTGRES_DB: opentalk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - ./pg_data${COMPOSE_PROJECT_NAME:+_$COMPOSE_PROJECT_NAME}:/var/lib/postgresql/data:Z
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:Z
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d opentalk
      interval: 10s
      timeout: 5s
      retries: 3

  livekit:
    image: registry.heinlein.group/opentalk/livekit-server:1.9
    network_mode: host
    restart: always
    command: --config /livekit.yaml --dev
    volumes:
      - ./livekit.yaml:/livekit.yaml:Z

  rabbitmq:
    image: registry.heinlein.group/opentalk/rabbitmq:4.2
    # image: rabbitmq:4-management
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit log.console.level=debug
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:Z
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:Z
    ports:
      - 127.0.0.1:8280:15672
      - 127.0.0.1:5672:5672
    expose:
      - 15692
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, check_port_connectivity]
      start_period: 120s
      start_interval: 10s
      interval: 180s
      timeout: 20s
      retries: 3

  redis:
    profiles:
      - extras
    image: registry.heinlein.group/opentalk/redis:v8.4
    command:
      - /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:Z
    ports:
      - 127.0.0.1:6379:6379

  redisinsight:
    image: redis/redisinsight
    profiles:
      - extras
    environment:
      - RI_ACCEPT_TERMS_AND_CONDITIONS=true
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=redis
    ports:
      - 127.0.0.1:5540:5540
    depends_on:
      - redis

  minio:
    image: registry.heinlein.group/opentalk/minio:RELEASE.2025-10-15T17-29-55Z
    volumes:
      - ./minio${COMPOSE_PROJECT_NAME:+_$COMPOSE_PROJECT_NAME}/storage:/data:Z
    entrypoint: ''
    command: >
      sh -c '
      mkdir -p /data/controller &&
      /usr/bin/docker-entrypoint.sh server /data --address ":9555" --console-address ":9556"
      '
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - 127.0.0.1:9555:9555
      - 127.0.0.1:9556:9556

  controller:
    image: git.opentalk.dev:5050/opentalk/backend/services/controller:dev
    profiles:
      - backend
    volumes:
      - ./controller/config.toml:/controller/config.toml:Z
    environment:
      - RUST_LOG=debug,rustls=info,tokio_tungstenite=info,tungstenite=info
      # - OPENTALK_CTRL__LOGGING__OTLP_TRACING_ENDPOINT="http://localhost:4317" # enables tracing (see jaeger)
      # - OPENTALK_CTRL__KEYCLOAK__BASE_URL=http://central-testing-keycloak:8080/auth
      # - OPENTALK_CTRL__KEYCLOAK__REALM=opentalk
      # - OPENTALK_CTRL__ETHERPAD__URL=http://etherpad/
      # - OPENTALK_CTRL__ETHERPAD__API_KEY=secret
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
      livekit:
        condition: service_started
        restart: true
      keycloak:
        condition: service_healthy
        restart: true

  frontend-roomserver:
    image: git.opentalk.dev:5050/opentalk/frontend/web/web-app:feature_roomserver
    profiles:
      - frontend-roomserver
    ports:
      - 127.0.0.1:3000:80
    volumes:
      - ./frontend/50-enable-cors.sh:/docker-entrypoint.d/50-enable-cors.sh:Z
    environment:
      - LIVEKIT_SERVER_URL=http://localhost:7880
      - CONTROLLER_HOST=localhost:8000
      - BASE_URL=http://localhost:3000
      - OIDC_ISSUER=http://localhost:8080/auth/realms/OPENTALK
      - INSECURE=true
      - LIVEKIT_PREFERRED_VIDEO_CODEC=vp9

  controller-roomserver:
    image: git.opentalk.dev:5050/opentalk/backend/services/controller:dev
    profiles:
      - backend-roomserver
    volumes:
      - ./controller/config-roomserver.toml:/controller/config.toml:Z
    environment:
      - RUST_LOG=debug,rustls=info,tokio_tungstenite=info,tungstenite=info
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      keycloak:
        condition: service_healthy
        restart: true

  roomserver:
    image: git.opentalk.dev:5050/opentalk/backend/services/roomserver:dev
    profiles:
      - roomserver
    volumes:
      - ./roomserver/roomserver.toml:/opentalk-roomserver/roomserver.toml:Z
    environment:
      - RUST_LOG=opentalk=debug
    network_mode: host
    healthcheck:
      test: [CMD, /opentalk-roomserver/opentalk-roomserver, health]
      start_period: 1s
      start_interval: 1s
    depends_on:
      livekit:
        condition: service_started
        restart: true

  etherpad:
    image: git.opentalk.dev:5050/opentalk/backend/containers/etherpad:latest
    profiles:
      - etherpad
    volumes:
      - type: bind
        source: ./etherpad/APIKEY.txt
        target: /opt/etherpad-lite/APIKEY.txt
    environment:
      # Set TRUST_PROXY if the etherpad is behind a reverse proxy
      # - TRUST_PROXY=true
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=admin
    ports:
      - 127.0.0.1:9001:9001

  spacedeck:
    image: git.opentalk.dev:5050/opentalk/backend/containers/spacedeck:dev
    profiles:
      - spacedeck
    restart: always
    environment:
      SD_HOST: 0.0.0.0
      SD_PORT: 9666
      SD_ENDPOINT: http://localhost:9666
      SD_API_TOKEN: noop2zu3OovooXeeb8theesi
      SD_INVITE_CODE: aiphivee0soo2ieS5duH8bei
    ports:
      - 127.0.0.1:9666:9666

  ndt:
    image: measurementlab/ndt-server:latest
    profiles:
      - extras
    volumes:
      # - ./ndt/certs:/certs:Z
      # - ./ndt/html:/html:Z
      - ./ndt/datadir:/datadir:Z
    cap_drop:
      - ALL
    ports:
      # - 127.0.0.1:10443:4443
      - 127.0.0.1:10081:8080
    command:
      # - -cert
      # - /certs/cert.pem
      # - -key
      # - /certs/key.pem
      - -datadir
      - /datadir
      # - -ndt7_addr
      # - :4443
      - -ndt7_addr_cleartext
      - :8080

  frontend:
    image: git.opentalk.dev:5050/opentalk/frontend/web/web-app:profiling
    profiles:
      - frontend
    ports:
      - 127.0.0.1:3000:80
    volumes:
      - ./frontend/50-enable-cors.sh:/docker-entrypoint.d/50-enable-cors.sh:Z
    environment:
      - LIVEKIT_SERVER_URL=http://localhost:7880
      - CONTROLLER_HOST=localhost:8000
      - BASE_URL=http://localhost:3000
      - OIDC_ISSUER=http://localhost:8080/auth/realms/OPENTALK
      - INSECURE=true
      - LIVEKIT_PREFERRED_VIDEO_CODEC=vp9

  prometheus:
    # https://hub.docker.com/r/prom/prometheus/tags
    image: quay.io/prometheus/prometheus:latest
    profiles:
      - metrics
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - rabbitmq-prometheus_prometheus:/prometheus:Z
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:Z

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    profiles:
      - metrics
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)
    expose:
      - 9100
      # https://hub.docker.com/r/prom/node-exporter/tags
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  redis-exporter:
    image: quay.io/oliver006/redis_exporter
    profiles:
      - metrics
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_EXPORTER_COUNT_KEYS=db0=opentalk-signaling:runner:*,db0=opentalk-signaling:room*participant*namespace*media*state

  grafana:
    # https://hub.docker.com/r/grafana/grafana/tags
    image: grafana/grafana:12.0.2
    profiles:
      - metrics
    ports:
      - 127.0.0.1:9000:3000
    volumes:
      - rabbitmq-prometheus_grafana:/var/lib/grafana:Z
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/rabbitmq.yaml:Z
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yaml:Z
      - ./grafana/dashboards:/dashboards:Z
    environment:
      # https://grafana.com/plugins/flant-statusmap-panel
      # https://grafana.com/plugins/grafana-piechart-panel
      # https://grafana.com/plugins/grafana-polystat-panel
      # https://grafana.com/plugins/jdbranham-diagram-panel
      # https://grafana.com/plugins/michaeldmoore-multistat-panel
      # https://grafana.com/plugins/vonage-status-panel
      # https://grafana.com/plugins/yesoreyeram-boomtable-panel
      GF_INSTALL_PLUGINS: flant-statusmap-panel,grafana-piechart-panel

  nextcloud:
    image: docker.io/library/nextcloud:apache
    profiles:
      - sharedfolder
    volumes:
      - ./nextcloud${COMPOSE_PROJECT_NAME:+_$COMPOSE_PROJECT_NAME}:/var/www/html:Z
    environment:
      - SQLITE_DATABASE=nextcloud
      - NEXTCLOUD_ADMIN_USER=exampleuser
      - NEXTCLOUD_ADMIN_PASSWORD=v3rys3cr3t
    ports:
      - 127.0.0.1:9002:80

  keycloak:
    image: registry.heinlein.group/opentalk/keycloak:26.4
    restart: always
    command:
      - start-dev
      - --import-realm
      - --health-enabled=true
      - --tracing-enabled=true
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password123
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # KC_HOSTNAME: keycloak
      KC_HTTP_RELATIVE_PATH: /auth
      KC_TRACING_ENDPOINT: http://jaeger:4317
    volumes:
      - ./keycloak:/opt/keycloak/data/import:Z
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test:
        - CMD-SHELL
        - >
          exec 3<>/dev/tcp/localhost/9000 &&
          { printf 'HEAD /auth/health/ready HTTP/1.0\r\n\r\n'; } >&3
          && head -7 <&3 | grep -m 1 'HTTP/1.0 200'
      start_period: 180s
      start_interval: 5s
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
        restart: true

  recorder:
    image: git.opentalk.dev:5050/opentalk/backend/services/recorder:dev
    restart: always
    profiles:
      - recorder
    volumes:
      - ./recorder/config.toml:/recorder/config.toml:Z
    environment:
      RUST_LOG: debug,k3k=debug,ezk=debug
      RUST_BACKTRACE: full
      GST_DEBUG: 3
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy

  jaeger:
    image: quay.io/jaegertracing/jaeger:2.8.0
    profiles:
      - metrics
    ports:
      - 127.0.0.1:16686:16686
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318

  smtp-mailer:
    image: git.opentalk.dev:5050/opentalk/backend/services/smtp-mailer:dev
    profiles:
      - mailer
    volumes:
      - ./smtp-mailer/config.toml:/opt/smtp-mailer/config.toml:Z
    depends_on:
      rabbitmq:
        condition: service_healthy

  mailcrab:
    image: marlonb/mailcrab:latest
    profiles:
      - mailer
    ports:
      - 127.0.0.1:1080:1080
      - 127.0.0.1:1025:1025
