---
version: '3.3'
networks:
  rabbitmq-prometheus: null
services:
  frontend:
    image: git.opentalk.dev:5050/opentalk/frontend/web/web-app:latest

    ports:
      - 3000:80
    environment:
      - CONTROLLER_HOST=localhost:8000
      - BASE_URL=http://localhost:3000
      - OIDC_ISSUER=http://localhost:8080/auth/realms/OPENTALK
      - INSECURE=true
